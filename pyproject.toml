[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewtide"
version = "1.0.0"
description = "Measure code review flow from offline git and pull request exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the reviewtide authors" }]
keywords = ["code-review", "git", "pull-request", "bus-factor", "metrics"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
reviewtide = "reviewtide.cli:main"
