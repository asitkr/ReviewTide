<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="ReviewTide banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="1" stop-color="#151d25"/>
    </linearGradient>
    <linearGradient id="tide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb6a8"/>
      <stop offset="1" stop-color="#2e8f84"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" fill="url(#bg)"/>
  <g stroke="#1e2831" stroke-width="1">
    <path d="M0 65 H960 M0 130 H960 M0 195 H960 M240 0 V260 M480 0 V260 M720 0 V260"/>
  </g>
  <text x="48" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f0f4f7">ReviewTide</text>
  <text x="48" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#93a9b8">where review time goes: queue, first response, depth and ownership</text>
  <g transform="translate(48 150)">
    <g font-family="Consolas, Menlo, monospace" font-size="12">
      <text x="0" y="12" fill="#9fb0bd">open</text>
      <line x1="44" y1="8" x2="240" y2="8" stroke="#2b3944" stroke-width="2"/>
      <text x="70" y="12" fill="#9fb0bd">queue</text>
      <rect x="108" y="2" width="52" height="12" rx="3" fill="#24343e"/>
      <text x="140" y="12" fill="#cfe0e8" text-anchor="middle">4.2h</text>
      <text x="188" y="12" fill="#9fb0bd">first review</text>
      <rect x="252" y="2" width="40" height="12" rx="3" fill="url(#tide)"/>
      <text x="330" y="12" fill="#3fb6a8">p50 6.1h</text>
      <text x="0" y="44" fill="#9fb0bd">approve</text>
      <line x1="44" y1="40" x2="240" y2="40" stroke="#2b3944" stroke-width="2"/>
      <rect x="108" y="34" width="36" height="12" rx="3" fill="#24343e"/>
      <text x="180" y="44" fill="#9fb0bd">rounds 2.3</text>
    </g>
  </g>
  <g transform="translate(560 60)">
    <text x="0" y="0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7f95a3">metrics</text>
    <text x="0" y="24" font-family="Consolas, Menlo, monospace" font-size="14" fill="#dde9ef">queue | latency | depth | ownership</text>
    <text x="0" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7f95a3">honesty</text>
    <text x="0" y="76" font-family="Consolas, Menlo, monospace" font-size="14" fill="#dde9ef">sample size beside every percentile</text>
    <text x="0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7f95a3">exit codes</text>
    <text x="0" y="132" font-family="Consolas, Menlo, monospace" font-size="14" fill="#dde9ef">0 clean | 1 findings | 2 usage</text>
  </g>
  <text x="48" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5d7684">offline | standard library only | python 3.11+</text>
</svg>
