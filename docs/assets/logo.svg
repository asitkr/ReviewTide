<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc" width="240" height="240">
  <!--
    Palette reason: the name is the compound review + tide. The wordmark makes
    one typographic decision, a colour split at that morpheme boundary, so the
    two halves of the tool (review data on the left, the flow or tide of it on
    the right) read at a glance. Slate for "review", teal for "tide", matching
    the diagram's core colours. No accent is needed here; the split is the point.
    Outside the forbidden indigo/violet/cyan/pink and neon-on-black schemes.
  -->
  <title id="title">reviewtide wordmark</title>
  <desc id="desc">The word reviewtide, with review in slate and tide in teal, split at the compound word boundary.</desc>
  <rect x="0" y="0" width="240" height="240" fill="#ffffff"/>

  <!-- wordmark, split at the review|tide boundary -->
  <text x="120" y="132" text-anchor="middle" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">
    <tspan fill="#475569">review</tspan><tspan fill="#0f766e">tide</tspan>
  </text>

  <!-- one deliberate rule under "tide": a short rising level line, the tide,
       drawn on a whole-pixel baseline, single stroke width -->
  <line x1="132" y1="150" x2="188" y2="150" stroke="#0f766e" stroke-width="3"/>
  <line x1="52" y1="150" x2="132" y2="150" stroke="#475569" stroke-width="3"/>

  <text x="120" y="182" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#475569">code review flow</text>
</svg>
