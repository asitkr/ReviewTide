<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc" width="640" height="400">
  <!--
    Palette reason: the subject is waiting time in a review queue. Bars use one
    calm slate (waiting is neutral, not alarming) with a single amber accent on
    the slow tail bin, the one place a reader should look because it holds the
    p90. Teal marks the median reference line. Two colours plus one accent, all
    outside the forbidden indigo/violet/cyan/pink and neon-on-black schemes.
    Numbers below are the real output of the reviewtide flow command run
    against samples/pr_export.jsonl.
    n=18. p50=3.8h, p75=17.5h, p90=49.2h, min=1.0h, max=67.0h.
    Bin counts over first-response latency in hours:
      [0,6)=10  [6,12)=2  [12,24)=3  [24,48)=1  [48,72)=2  (sum 18)
  -->
  <title id="title">First response latency distribution</title>
  <desc id="desc">Histogram of hours from pull request opened to first review across 18 reviewed pull requests. Median 3.8 hours, 90th percentile 49.2 hours. Bins: 0 to 6 hours has 10, 6 to 12 has 2, 12 to 24 has 3, 24 to 48 has 1, 48 to 72 has 2.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <text x="32" y="36" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b">First response latency, reviewtide flow</text>
  <text x="32" y="56" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#475569">n=18 reviewed PRs   p50=3.8h  p75=17.5h  p90=49.2h  max=67.0h</text>

  <!-- plot frame: x axis at y=320, y axis at x=72 -->
  <!-- y scale: count 0..10 maps to pixels 320..90, so 23px per unit -->
  <line x1="72" y1="90" x2="72" y2="320" stroke="#475569" stroke-width="1"/>
  <line x1="72" y1="320" x2="600" y2="320" stroke="#475569" stroke-width="1"/>

  <!-- y gridline labels (counts): 0,2,4,6,8,10 -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#475569">
    <text x="64" y="324" text-anchor="end">0</text>
    <text x="64" y="278" text-anchor="end">2</text>
    <text x="64" y="232" text-anchor="end">4</text>
    <text x="64" y="186" text-anchor="end">6</text>
    <text x="64" y="140" text-anchor="end">8</text>
    <text x="64" y="94" text-anchor="end">10</text>
  </g>

  <!-- bars: width 88, gap keeps 8px. base y=320 -->
  <!-- bin [0,6) count 10 -> height 230, top 90 -->
  <rect x="80" y="90" width="88" height="230" fill="#475569"/>
  <text x="124" y="84" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#1e293b">10</text>
  <!-- bin [6,12) count 2 -> height 46, top 274 -->
  <rect x="176" y="274" width="88" height="46" fill="#475569"/>
  <text x="220" y="268" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#1e293b">2</text>
  <!-- bin [12,24) count 3 -> height 69, top 251 -->
  <rect x="272" y="251" width="88" height="69" fill="#475569"/>
  <text x="316" y="245" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#1e293b">3</text>
  <!-- bin [24,48) count 1 -> height 23, top 297 -->
  <rect x="368" y="297" width="88" height="23" fill="#475569"/>
  <text x="412" y="291" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#1e293b">1</text>
  <!-- bin [48,72) count 2 -> height 46, top 274. accent: holds p90 tail -->
  <rect x="464" y="274" width="88" height="46" fill="#b45309"/>
  <text x="508" y="268" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#1e293b">2</text>

  <!-- x axis bin labels (hours) -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11" fill="#475569">
    <text x="124" y="338" text-anchor="middle">0-6</text>
    <text x="220" y="338" text-anchor="middle">6-12</text>
