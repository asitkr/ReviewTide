<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc" width="240" height="240">
  <!--
    Palette reason: the name is the compound review + tide. The wordmark makes
    one typographic decision, a colour split at that morpheme boundary, so the
    two halves of the tool (review data on the left, the flow or tide of it on
    the right) read at a glance. Slate for "review", teal for "tide", matching
    the diagram's core colours. No accent is needed here; the split is the point.
    Outside the forbidden indigo/violet/cyan/pink and neon-on-black schemes.
